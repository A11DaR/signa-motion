name: Import original SIGNA history
on:
  push:
    branches: [import-signa]
    paths: [.github/workflows/import-history.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'A11DaR/signa-motion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Verify archive and publish original commits
        shell: bash
        run: |
          set -euo pipefail
          cat signa-history.bundle.part* > "$RUNNER_TEMP/signa-history.bundle"
          echo "2522ff196dd1829c39b3851d563a202a54d22de725cbea0ab549fa722b0e8355  $RUNNER_TEMP/signa-history.bundle" | sha256sum --check
          git bundle verify "$RUNNER_TEMP/signa-history.bundle"
          git fetch "$RUNNER_TEMP/signa-history.bundle" refs/heads/submission/github:refs/remotes/imported/main
          test "$(git rev-parse refs/remotes/imported/main)" = "7b6f7355ca36361322fea8bc879ffaa6290a1c79"
          git push origin refs/remotes/imported/main:refs/heads/preserved-history
